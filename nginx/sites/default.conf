server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    default_type text/plain;
    charset utf-8;
    return 200 "Ambiente Docker (PHP 8.1 + Nginx + MySQL) ativo.\n\nCopie nginx/sites/projeto.conf.example para um arquivo .conf, ajuste server_name e root, depois: docker compose restart nginx\n";
}
